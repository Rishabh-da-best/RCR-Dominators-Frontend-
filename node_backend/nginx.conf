# Nginx reverse-proxy config for the Poway Midland Railroad WebSocket backend.
# Copy tcd /etc/nginx/sites-available-ws on your server, then:
#   sudo ln -s /etc/nginx/sites-available-ws /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_HERE with your actual domain before enabling.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name rcr.opencodingsociety.com;

    location /RCR {
        proxy_pass          http://localhost:3000;

        # Required for WebSocket / Socket.io
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host       $http_host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeouts long enough for persistent WS connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
